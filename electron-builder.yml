appId: com.galaxychjs.commandshelf
productName: CommandShelf
copyright: Copyright © 2025 Galaxy-Chjs

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

asar: true

# Everything the app needs is bundled into out/ by electron-vite, so no
# node_modules payload is shipped. See docs/architecture.md.
npmRebuild: false
nodeGypRebuild: false

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CommandShelf
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  icon: build/icon.png
  category: Development
  synopsis: Local command, prompt and snippet workspace
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
