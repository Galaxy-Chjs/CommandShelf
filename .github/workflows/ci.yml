name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (main, renderer, e2e)
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:coverage

      - name: Documentation links
        run: npm run check:docs

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The suite drives the real Electron binary, so it needs a machine that
        # can actually open a window. Linux runners have no display.
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `electron@44` no longer declares a postinstall of its own, so the binary
      # is fetched by this project's own `postinstall` script. If that ever
      # regresses, every test fails in under a second with an opaque spawn
      # error, so check the binary here where the reason is obvious.
      - name: Verify the Electron binary
        shell: pwsh
        run: |
          $pkg = "node_modules/electron"
          $binary = Join-Path $pkg "dist/electron.exe"
          Write-Host "path.txt present : $(Test-Path (Join-Path $pkg 'path.txt'))"
          Write-Host "binary present   : $(Test-Path $binary)"
          Write-Host "node             : $(node --version)"
          Write-Host "npm              : $(npm --version)"
          if (-not (Test-Path $binary)) {
            Write-Error "Electron binary missing — the postinstall did not download it."
            exit 1
          }

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
